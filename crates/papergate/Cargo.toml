[package]
name = "papergate"
description = "Run the papergate promptforge prompt against a WG21 paper markdown file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive", "env"] }
fastrand = "2.5.0"
paperstore = { version = "0.1.0", path = "../paperstore" }
paperstore-sqlite = { version = "0.1.0", path = "../paperstore-sqlite" }
promptforge-api-runtime = { path = "../../vendor/promptforge/crates/promptforge-api-runtime" }
promptforge-api-types = { path = "../../vendor/promptforge/crates/promptforge-api-types" }
shared-vfs = { path = "../../vendor/promptforge/crates/shared-vfs" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
