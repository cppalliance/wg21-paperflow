[package]
name = "papergate"
description = "Run the papergate promptforge prompt against a WG21 paper markdown file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
fastrand = "2.5.0"
promptforge-core = { path = "../../../promptforge/crates/promptforge-core" }
promptforge-tool-picker = { path = "../../../promptforge/crates/promptforge-tool-picker" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs"] }

[dev-dependencies]
tempfile = "3.27.0"
