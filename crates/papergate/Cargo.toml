[package]
name = "papergate"
description = "Run a promptforge prompt against a WG21 paper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
harness = { path = "../../../promptforge/crates/harness" }
paperstore = { version = "0.1.0", path = "../paperstore" }
paperstore-sqlite = { version = "0.1.0", path = "../paperstore-sqlite" }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "signal", "fs", "sync"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
