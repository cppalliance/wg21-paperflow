[package]
name = "paperweight"
description = "Run a runvil prompt against a WG21 paper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
# The runvil harness, vendored through the vendor/promptforge
# submodule and pinned to the commit the crate is built against.
harness = { path = "../../vendor/promptforge/crates/harness" }
# The standard client that sends the Harness's model rounds to the gateway.
harness-gateway-client = { path = "../../vendor/promptforge/crates/harness-gateway-client" }
paperstore = { version = "0.1.0", path = "../paperstore" }
paperstore-sqlite = { version = "0.1.0", path = "../paperstore-sqlite" }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt", "macros", "signal", "fs", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
