[project]
name = "promptforge"
version = "0.4.1"
description = "Markdown-driven LLM pipeline runtime: sections as program, tool-call state, embedded Lua config"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "lupa>=2.7",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptforge"]
