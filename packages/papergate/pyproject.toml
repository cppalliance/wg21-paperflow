[project]
name = "papergate"
version = "0.4.1"
description = "PaperGate: a WG21 paper admission-gate pipeline on the PromptForge runtime"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "promptforge",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papergate"]
