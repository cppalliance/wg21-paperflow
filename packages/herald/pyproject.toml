[project]
name = "herald"
version = "0.4.1"
description = "Herald collection layer: per-source incremental ingestion for the C++ ecosystem"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Will Pak", email = "will@cppalliance.org"}]
dependencies = [
    "aiohttp",
    "aiolimiter",
    "feedparser",
    "fsspec",
    "prometheus-client",
    "protego",
    "pydantic>=2.0",
    "stamina",
    "structlog",
    "tldextract",
    "trafilatura",
    "w3lib",
    "zstandard",
]

[project.scripts]
herald = "herald.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herald"]
