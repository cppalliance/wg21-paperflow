[project]
name = "assay"
version = "0.4.1"
description = "WG21 paper assay pipeline (two-pass structural analysis)"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "jinja2",
    "joblib",
    "numpy",
    "paperstore",
    "pipeline",
    "pydantic-ai",
    "pydantic>=2.0",
    "pysbd>=0.3.4",
    "scikit-learn==1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]

[tool.hatch.build.targets.wheel.force-include]
"data/routing" = "assay/data/routing"
"data/nli" = "assay/data/nli"
"data/seqcls" = "assay/data/seqcls"
