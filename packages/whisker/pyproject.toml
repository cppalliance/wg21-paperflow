[project]
name = "whisker"
version = "0.5.0"
description = "Deterministic QA verdict + benchmark for tomd conversions (no LLM)"
requires-python = ">=3.12"
license = {text = "BSL-1.0"}
authors = [{name = "Vinnie Falco", email = "vinnie.falco@gmail.com"}]
dependencies = [
    "apted>=1.0.3",
    "grits-metric>=0.6.0",
    "lxml>=5.0.0",
    "markitdown[pdf]>=0.1.6",
    "mistune~=3.2.0",
    "numpy>=1.26",
    "paperstore",
    "pylatexenc>=2.10",
    "rapidfuzz>=3.14.5,<4",
    "scipy>=1.11",
    "tomd",
]

[project.scripts]
whisker = "whisker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisker"]
