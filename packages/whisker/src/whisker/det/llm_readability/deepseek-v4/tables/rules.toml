# --- required probes ----------------------------------------------------------

[[probes]]
id = "cell-lookup-with-corrupt-control"
rules = ["R13"]
description = '''
Positional cell lookup. Identify the target table by quoting its full header
row (all column names), then ask for specific cells by 1-based body-row index
and column name. "Body row 1" is the first data row after the header and
separator; the header itself is never a body row. Probe up to 3 non-empty
cells, one per body row, on the table with the most cells.

Repeat the identical questions against a deterministically corrupted copy whose
pipe-table cells are reversed. The clean run must recover the cells and the
corrupt run must fail them; a corrupt control that does not invert makes the
probe unevaluated, never pass.

This is the hard test: it measures whether the model can count rows, not just
find a cell by its content. Content-anchored lookup (readback Lane 3) is a
separate, weaker claim.
'''
evidence = ["packages/whisker/corpus/READBACK-CERTIFICATE.md"]

[[probes]]
id = "column-association-narrow-table"
rules = ["R7", "R13"]
description = '''
Header-anchored column association. Identify the target table by quoting its
full header row so tables with identical column names are disambiguated. Ask
for a value under a specific header label ("What value appears under column
'SF'?"), not for the table's contents as a whole. The table must be narrow
(column count at or below the wide_table_column_threshold).

This is the weak test relative to positional lookup: the model only needs to
associate a value with its column header, not count rows. The probe is required
even though the most recent run passes it: the column-association failure it
targets is intermittent on this model, so a single clean result does not retire
it.
'''
evidence = [
  "packages/whisker/src/whisker/llm/calibration/tables/fullread-32-test-comprehension.md:136",
  "packages/whisker/FIXPATH-REPORT.md:90-99",
]

[[probes]]
id = "merged-cell-denormalization"
rules = ["R5"]
description = '''
Probe a table whose source carried a spanning cell. The model must accept a
faithfully repeated value as correct and must reject a value repeated into rows
the span did not cover; both directions are required, because the lineage fails
in both.
'''
evidence = [
  "packages/whisker/research/research/deepseek-v4-pro/04-table-understanding.md",
]

[[probes]]
id = "code-in-cell-structure"
rules = ["R11"]
description = '''
Probe a table whose cells carry code. The model must report the code's line
structure, so a listing flattened into a single pipe cell is detected instead of
paraphrased back as prose.
'''
evidence = [
  "packages/whisker/research/research/deepseek-v4-pro/04-table-understanding.md",
]

[[probes]]
id = "per-unit-count-dump"
rules = ["R1", "R2"]
description = '''
Per-unit count-dump probe (v1.1.0). Iterates every pipe table unit in the paper,
classifies each as label_shift, data_as_header, wrap_bleed, continuation,
header_is_data, truncated_leak, row_merge, or aligned, and runs one count-dump
or closed question per unit. Sends only the isolated table fragment with the
R1-aware system prompt. Priority:
label_shift > wrap_bleed > data_as_header > continuation > header_is_data >
truncated_leak > row_merge > aligned.
Label-shift units are scored by the deterministic cell-dump scorer;
data_as_header units (all-numeric header, blank body) use count-dump with
score_numeric_header_dump; wrap_bleed units (sentence fragment header bleeding
into body) use count-dump with score_wrap_bleed_dump; continuation and
header_is_data units use the closed "data values" question;
truncated_leak units receive the table plus trailing prose and are asked
"leaked rows or prose?"; row_merge units are asked how many distinct
row-records a cell contains (integer >= 2 confirms defect);
aligned units are scored by comparing each dumped cell against the unit's
actual cells. Results are compared against a human-review punch-list: every
known defect must appear, and no aligned unit may false-fail. This is evidence
about per-table model comprehension, not a certification gate.
'''
evidence = [
  "packages/whisker/src/whisker/llm/calibration/tables/evidence/n5040-attendance/notes.md",
  "packages/whisker/src/whisker/llm/calibration/tables/evidence/n5040-attendance/all-tables.md",
