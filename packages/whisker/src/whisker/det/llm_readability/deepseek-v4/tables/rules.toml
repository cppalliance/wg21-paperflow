Measured locally: the P4185R0 table-anchored fact failed under de-needle-v2 with
the wrong neighbor cells returned, while the deterministic lane passed every one
of the same facts on the same markdown. A green deterministic representation
check therefore does not predict that this model reads the cell correctly.
'''
evidence = [
