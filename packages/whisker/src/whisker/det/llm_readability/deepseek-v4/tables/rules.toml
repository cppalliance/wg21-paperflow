[[known_weaknesses]]
id = "near-zero-abstention"
rules = ["R5", "R10", "R11"]
description = '''
The model abstains almost never, so an unreadable or missing table region tends
to come back as a confident answer rather than as an unknown. Consequences for
this contract: a model verdict without grounded verbatim cell evidence must not
close a source-compare rule, and confidence is not usable as a proxy for
correctness.
'''
