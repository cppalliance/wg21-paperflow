# On release, builds paperweight for x86_64 Linux and attaches it to the release.
# Pre-releases (such as QA screenshot releases) are skipped.

name: Release paperweight

on:
  release:
    types: [published]

jobs:
  linux:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The paperweight crate depends on promptforge through the
      # vendor/promptforge submodule, so the checkout must be recursive.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Installs the toolchain pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Build paperweight
        run: cargo build --release -p paperweight --locked

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          asset="paperweight-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "$asset" -C target/release paperweight
          sha256sum "$asset" > "$asset.sha256"
          gh release upload "$TAG" "$asset" "$asset.sha256"
